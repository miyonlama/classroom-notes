<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classroom Notes — Learn by Exploring</title>
  <link rel="stylesheet" href="assets/css/hub.css" />
</head>
<body>
  <div class="chalk-dust" aria-hidden="true"></div>
  <div class="projector" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#top" aria-label="Classroom Notes home">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Classroom Notes</span>
    </a>
    <div class="utility">
      <label class="search">
        <span class="sr-only">Filter subjects</span>
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
        <input id="search" type="search" placeholder="Filter subjects" autocomplete="off" />
      </label>
      <a class="index-link" href="notes/index.html">Notes index <span aria-hidden="true">&rarr;</span></a>
    </div>
  </header>

  <main id="top">
    <section class="decks" aria-labelledby="page-title">
      <div class="decks-head">
        <h1 id="page-title">Learn by <span>Exploring</span></h1>
        <p>Five subjects, one syllabus. Open the one you need.</p>
      </div>

      <div class="decks-body">
        <nav class="syllabus" aria-label="Subject syllabus">
          <div class="syllabus-title">Syllabus</div>
          <ol id="rail"></ol>
        </nav>

        <div class="slides-area">
          <div class="slides" id="cards" aria-label="Subject slides"></div>
          <p id="empty" class="empty" hidden>No subject matches that filter.</p>

          <article class="live-slide" id="live-slide" aria-live="polite">
            <div class="slide-head">
              <span class="slide-index" id="slide-index">01</span>
              <h2 id="slide-title">Discrete Structure</h2>
            </div>
            <p class="slide-desc" id="slide-desc"></p>
            <ol class="chapter-list" id="chapter-list"></ol>
            <a class="primary" id="slide-link" href="notes/discrete-structure.html">Open subject <span aria-hidden="true">&rarr;</span></a>
          </article>
        </div>
      </div>
    </section>

    <section class="chalk-tray" aria-label="Archive note">
      <span>Classroom Notes / 2026</span>
      <span class="tray-rule" aria-hidden="true"></span>
      <span>Keep reading.</span>
    </section>
  </main>

  <script src="assets/js/hub.js" defer></script>
</body>
</html>
